name: Workflow issue
description: Report a reproducible problem with a workflow rule, script, or evidence gate.
title: "[Issue]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, private source code, credentials, or absolute personal paths.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Project contract initialization
        - Baseline capture
        - Watchdog evidence gate
        - Fix attempt accounting
        - Rollback
        - UI workflow
        - Documentation or links
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Commands, configuration fields, and expected versus observed output. Use a disposable project.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Bash version, Git version, Node.js version, and Agent or tool name.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested resolution
      description: Optional. Explain what should change while preserving evidence semantics.
    validations:
      required: false
